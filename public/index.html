<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151c1e" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <title>Кира</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-box" id="login-form">
      <h1 class="brand">Кира</h1>
      <label for="password">Пароль</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn primary">Войти</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <nav class="side" aria-label="Разделы">
      <div class="brand-row"><span class="brand">Кира</span></div>
      <a href="/" data-view="today">Сегодня</a>
      <a href="/inbox" data-view="inbox">Входящие</a>
      <a href="/tasks" data-view="tasks">Задачи</a>
      <a href="/tracks" data-view="tracks">Треки</a>
      <a href="/projects" data-view="projects">Проекты</a>
      <a href="/missions" data-view="missions">Миссии</a>
      <a href="/people" data-view="people">Люди</a>
      <a href="/assistant" data-view="assistant">Ассистент</a>
      <a href="/jobs" data-view="jobs">Задания Киры</a>
      <a href="/changes" data-view="changes">История</a>
      <div class="side-group">
        <div class="side-head"><span>Треки и проекты</span></div>
        <div id="tree"></div>
      </div>
      <a href="/settings" data-view="settings" class="side-bottom">Настройки</a>
    </nav>

    <main class="main" id="main" tabindex="-1"></main>

    <aside class="drawer" id="drawer" hidden aria-label="Карточка записи"></aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
