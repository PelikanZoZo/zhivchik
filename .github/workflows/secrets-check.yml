# Проверка секретов: заданы ли они, пускает ли хостинг по FTP и SSH, работает ли ключ DeepSeek. (запуск 09:40)
# Репозиторий публичный, поэтому в результат не пишутся ни адреса, ни логины, ни пароли —
# только «задан / пусто» и «подключение есть / нет».
# Результат сохраняется в docs/secrets-check.txt.
name: Проверка секретов
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/secrets-check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p docs
          out=docs/secrets-check.txt
          {
            echo "Проверка: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "=== Секреты"
            for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD SSH_HOST SSH_USER SSHPASS DEEPSEEK_API_KEY CF_TOKEN CF_ACCOUNT TELEGRAM_BOT_TOKEN TELEGRAM_OWNER_ID ADMIN_PASSWORD BRIDGE_SECRET; do
              name=$v; [ "$v" = SSHPASS ] && name=SSH_PASSWORD
              [ "$v" = CF_TOKEN ] && name=CLOUDFLARE_API_TOKEN; [ "$v" = CF_ACCOUNT ] && name=CLOUDFLARE_ACCOUNT_ID
              val="${!v}"
              if [ -z "$val" ]; then echo "$name: ПУСТО"; continue; fi
              note=""
              case "$val" in " "*|*" ") note=" (пробел по краям!)";; esac
              case "$val" in *$'\n'*|*$'\r'*) note="$note (перенос строки!)";; esac
              case "$v" in FTP_SERVER|SSH_HOST) case "$val" in *://*) note="$note (лишний протокол в адресе!)";; esac;; esac
              echo "$name: задан$note"
            done
            echo
            echo "=== FTP"
            if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
              if list=$(curl -sS --max-time 40 --list-only "ftp://$FTP_SERVER/" --user "$FTP_USERNAME:$FTP_PASSWORD" 2>&1); then
                echo "подключение: ЕСТЬ"
                echo "папок/файлов в корне: $(printf '%s\n' "$list" | grep -c .)"
              else
                echo "подключение: НЕТ"
                printf '%s\n' "$list" | grep -o 'curl: ([0-9]*)[^:]*' | head -1
              fi
            else
              echo "пропущено: не все FTP-секреты заданы"
            fi
            echo
            echo "=== SSH"
            if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSHPASS" ]; then
              res=$(timeout 60 sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
                -o PreferredAuthentications=password,keyboard-interactive \
                "$SSH_USER@$SSH_HOST" 'echo SSH_OK; command -v node >/dev/null && echo "node: есть" || echo "node: не найден в PATH"' 2>&1) || true
              if printf '%s' "$res" | grep -q SSH_OK; then
                echo "подключение: ЕСТЬ"
                printf '%s\n' "$res" | grep '^node:'
              else
                echo "подключение: НЕТ"
                case "$res" in
                  *"ermission denied"*) echo "причина: неверный логин или пароль";;
                  *"ould not resolve"*) echo "причина: адрес сервера не найден";;
                  *"refused"*) echo "причина: сервер отказал в соединении (порт закрыт)";;
                  *"timed out"*|*"imeout"*) echo "причина: сервер не ответил вовремя";;
                  *) echo "причина: не распознана";;
                esac
              fi
            else
              echo "пропущено: не все SSH-секреты заданы"
            fi
            echo
            echo "=== DeepSeek"
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              code=$(curl -s --max-time 30 -o models.json -w '%{http_code}' https://api.deepseek.com/models \
                -H "Authorization: Bearer $DEEPSEEK_API_KEY")
              case "$code" in
                200) echo "ключ: РАБОЧИЙ"; echo "модели: $(jq -r '[.data[].id]|join(", ")' models.json 2>/dev/null)";;
                401) echo "ключ: НЕ ПРИНЯТ (401, неверный ключ)";;
                *) echo "ключ: ошибка проверки (HTTP $code)";;
              esac
              avail=$(curl -s --max-time 30 https://api.deepseek.com/user/balance \
                -H "Authorization: Bearer $DEEPSEEK_API_KEY" | jq -r '.is_available' 2>/dev/null)
              case "$avail" in
                true) echo "баланс: есть средства для запросов";;
                false) echo "баланс: НЕДОСТАТОЧНО средств, запросы работать не будут";;
                *) echo "баланс: не удалось узнать";;
              esac
              # Один короткий запрос к модели — проверка, что ответы реально приходят
              ans=$(curl -s --max-time 60 https://api.deepseek.com/chat/completions \
                -H "Authorization: Bearer $DEEPSEEK_API_KEY" -H "Content-Type: application/json" \
                -d '{"model":"deepseek-chat","max_tokens":10,"messages":[{"role":"user","content":"Ответь одним словом: работает"}]}' \
                | jq -r '.choices[0].message.content // ("ошибка: " + (.error.message // "нет ответа"))' 2>/dev/null)
              echo "пробный запрос: $ans"
              rm -f models.json
            else
              echo "пропущено: DEEPSEEK_API_KEY не задан"
            fi
            echo
            echo "=== Cloudflare"
            if [ -n "$CF_TOKEN" ]; then
              api() { curl -s --max-time 30 -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
              st=$(api /user/tokens/verify | jq -r 'if .success then .result.status else ("ошибка: " + (.errors[0].message // "?")) end')
              echo "токен: $st"
              if [ -n "$CF_ACCOUNT" ]; then
                r=$(api "/accounts/$CF_ACCOUNT/workers/scripts")
                echo "доступ к Workers в аккаунте: $(echo "$r" | jq -r 'if .success then "ЕСТЬ (воркеров сейчас: \(.result|length))" else ("НЕТ: " + (.errors[0].message // "?")) end')"
                sub=$(api "/accounts/$CF_ACCOUNT/workers/subdomain" | jq -r '.result.subdomain // empty')
                [ -n "$sub" ] && echo "поддомен workers.dev: заведён" || echo "поддомен workers.dev: НЕ заведён (заведу при первой выкладке)"
              fi
            else
              echo "пропущено: CLOUDFLARE_API_TOKEN не задан"
            fi
            echo
            echo "=== Telegram"
            if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
              echo "бот: $(curl -s --max-time 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe" | jq -r 'if .ok then "РАБОЧИЙ, @" + .result.username else "токен НЕ принят" end')"
            else
              echo "пропущено: TELEGRAM_BOT_TOKEN не задан"
            fi
            case "$TELEGRAM_OWNER_ID" in "") ;; *[!0-9-]*) echo "TELEGRAM_OWNER_ID: должен быть числом!";; *) echo "TELEGRAM_OWNER_ID: число, ок";; esac
            [ -n "$BRIDGE_SECRET" ] && [ ${#BRIDGE_SECRET} -lt 32 ] && echo "BRIDGE_SECRET: коротковат, лучше 40+ символов"
            echo
            echo "=== HTTPS devalby.ru"
            curl -sS --max-time 30 -o /dev/null -w "HTTP %{http_code}, сертификат в порядке\n" https://devalby.ru/ 2>&1 | grep -oE "HTTP [0-9]+, сертификат в порядке|self-signed|alert internal error|verify result: [^ ]+|no alternative[^']*" | head -1
          } > "$out" 2>&1
          cat "$out"
      - name: Сохранить результат
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/secrets-check.txt
          git commit -m "Результат проверки секретов" || exit 0
          git pull --rebase -q && git push
