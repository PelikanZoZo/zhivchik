# Автовыкладка на хостинг: при каждом изменении в main собирает проект и заливает его по FTP в www/.
name: Выкладка на хостинг
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "tools/**"]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Собрать
        run: |
          npm ci --omit=dev
          mkdir -p dist/tmp
          cp -r app.js package.json package-lock.json src public node_modules dist/
          date -u > dist/tmp/restart.txt

      - name: Залить в www/ и перезапустить
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p docs
          set -o pipefail
          # Хостинг перезапускает приложение, когда меняется tmp/restart.txt
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no; set net:timeout 30; set net:max-retries 3; set ftp:passive-mode yes;
            mirror -R --verbose=1 --parallel=4 --only-newer dist/ www/;
            mkdir -p tmp; put dist/tmp/restart.txt -o tmp/restart.txt;
            ls www/;
            bye" 2>&1 | sed "s/$FTP_PASSWORD/***/g" | tail -60 > docs/deploy-log.txt && status=0 || status=$?
          echo "итог: $status" >> docs/deploy-log.txt
          cat docs/deploy-log.txt
          exit $status

      - name: Проверить, что сайт ожил
        if: always()
        run: |
          sleep 15
          {
            echo "--- проверка сайта $(date -u '+%H:%M UTC')"
            for u in http://devalby.ru/api/state http://devalby.ru/api/details http://devalby.ru/; do
              echo ">> $u"
              curl -sS --max-time 60 -w "\n[HTTP %{http_code}]\n" "$u" 2>&1 | head -c 600
              echo
            done
          } >> docs/deploy-log.txt

      - name: Сохранить журнал выкладки
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/deploy-log.txt
          git commit -m "Журнал выкладки" || exit 0
          git pull --rebase -q && git push
