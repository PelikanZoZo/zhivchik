# Автовыкладка на хостинг: при каждом изменении в main собирает проект и заливает его по FTP в www/.
name: Выкладка на хостинг
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "tools/**"]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Собрать
        run: |
          npm ci --omit=dev
          mkdir -p dist/tmp
          cp -r app.js server.js package.json package-lock.json src public node_modules dist/
          date -u > dist/tmp/restart.txt

      - name: Залить в www/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: www/

      - name: Перезапустить приложение
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Хостинг перезапускает приложение, когда меняется tmp/restart.txt
          for target in www/tmp/restart.txt tmp/restart.txt; do
            curl -sS --max-time 30 --ftp-create-dirs -T dist/tmp/restart.txt "ftp://$FTP_SERVER/$target" --user "$FTP_USERNAME:$FTP_PASSWORD" || true
          done
