# Команды на хостинге по SSH. Скрипт — ops/remote.sh, запускается при его изменении.
# Вывод (без паролей) сохраняется в docs/ops-log.txt.
name: Команды на хостинге
on:
  workflow_dispatch:
  push:
    paths: ["ops/remote.sh"]
permissions:
  contents: write
concurrency:
  group: ssh-ops
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Выполнить ops/remote.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p docs
          {
            echo "Запуск: $(date -u '+%Y-%m-%d %H:%M UTC')"
            timeout 300 sshpass -e ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" 'bash -s' < ops/remote.sh 2>&1 \
              | sed -e "s/$SSHPASS/***/g" | grep -aviE "pass(word)?=|DBPASS"
            echo "--- снаружи, через интернет:"
            for u in http://devalby.ru/ https://devalby.ru/; do
              echo ">> $u"; curl -sS --max-time 60 -o body.txt -w "HTTP %{http_code} -> %{redirect_url}\n" "$u"; head -c 200 body.txt | sed -e 's/<[^>]*>//g' | tr -s ' \n' ' '; echo
            done
          } > docs/ops-log.txt 2>&1 || true
          cat docs/ops-log.txt
      - name: Сохранить вывод
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/ops-log.txt
          git commit -m "Вывод команд на хостинге" || exit 0
          git pull --rebase -q && git push
