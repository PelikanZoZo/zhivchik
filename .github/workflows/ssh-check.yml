# Диагностика по SSH: смотрит, где лежит приложение и что пишет журнал ошибок.
# Результат (без паролей) записывается в docs/ssh-check.txt.
name: Проверка SSH
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/ssh-check.yml", "docs/ssh-check.request"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подключиться по SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          DBPASS_MASK: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null
          mkdir -p docs
          {
            echo "Проверка: $(date -u '+%Y-%m-%d %H:%M UTC')"
            for v in SSH_HOST SSH_USER SSHPASS; do [ -n "${!v}" ] && echo "$v: задан" || echo "$v: ПУСТО"; done
            timeout 120 sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o PreferredAuthentications=password,keyboard-interactive "$SSH_USER@$SSH_HOST" '
              export PATH=/usr/nvm/versions/node/v21.5.0/bin:$PATH
              echo "=== время сервера"; date; date -u
              echo "=== как запускается приложение"; cat /opt/scripts/node-wrapper.sh 2>&1 | head -60
              echo "=== файлы www"; ls -la --time-style=+%F_%T ~/devalby.ru/www ~/devalby.ru/www/tmp ~/devalby.ru/tmp 2>&1
              echo "=== процессы"; ps -eo pid,lstart,args 2>/dev/null | grep -a "app.js" | grep -av grep
              echo "=== переменные окружения процесса (только имена)"; for p in $(pgrep -f "unit-http/loader app.js" | head -1); do tr "\0" "\n" < /proc/$p/environ 2>/dev/null | cut -d= -f1 | sort | tr "\n" " "; echo; done
              echo "=== журнал ошибок (последние 80 строк)"; tail -80 ~/log/devalby.ru.error.log
              echo "=== проверка запуска кода"; cd ~/devalby.ru/www && timeout 10 node -e "import(\"./src/store/index.js\").then(m=>console.log(\"модули грузятся\")).catch(e=>console.log(\"ОШИБКА\",e.message))"
            ' 2>&1 | sed -e "s/$SSHPASS/***/g" | grep -viE "pass(word)?=|DBPASS" 
          } > docs/ssh-check.txt 2>&1 || true
          cat docs/ssh-check.txt
      - name: Сохранить результат
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/ssh-check.txt
          git commit -m "Результат проверки SSH" || exit 0
          git pull --rebase -q && git push
